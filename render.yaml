services:

  # ── Backend: FastAPI ──────────────────────────────────────────────────────
  - type: web
    name: inkingi-shield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inkingi-db
          property: connectionString

  # ── Frontend: React/Vite Static Site ──────────────────────────────────────
  - type: web
    name: inkingi-shield-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://inkingi-shield-api.onrender.com

databases:
  - name: inkingi-db
    databaseName: inkingi
    plan: free
