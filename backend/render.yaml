# render.yaml
# Render reads this file to know how to deploy your backend.
# Push this to your GitHub repo, then connect the repo on render.com

services:
  - type: web
    name: inkingi-shield-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true        # Render auto-generates a secure random value
      - key: DATABASE_URL
        fromDatabase:
          name: inkingi-db
          property: connectionString

databases:
  - name: inkingi-db
    databaseName: inkingi
    plan: free
